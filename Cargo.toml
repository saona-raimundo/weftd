# Cargo.toml

[package]
name = "weftd"
version = "0.1.0"
edition = "2024"
authors = ["Raimundo Saona <raimundo.saona@gmail.com>"]
license = "MIT OR Unlicense OR CC0-1.0 OR Apache-2.0"
readme = "README.md"
keywords = ["llm", "llama-cpp", "local-llm", "prompt", "roleplay"]
categories = ["command-line-utilities", "text-processing"]
rust-version = "1.88"

[dependencies]
anyhow = "1.0.102"
reqwest = { version = "0.12", features = ["json", "stream"] }
reqwest-eventsource = "0.6"
axum = { version = "0.8", features = ["ws"] }
bm25 = { version = "2", default-features = false, features = ["default_tokenizer"] }
clap = { version = "4.6", features = ["derive"] }
futures = "0.3"
open = "5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1.51", features = ["full"] }
toml = "1.1"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "registry"] }
yake-rust = { version = "1", default-features = false, features = ["en"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2.185"
